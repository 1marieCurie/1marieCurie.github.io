 <path d="M151 220 C177 145 218 112 271 122 C321 131 359 173 390 220 C359 267 321 309 271 318 C218 328 177 295 151 220Z" fill="#5679d4" fill-opacity=".08" stroke="url(#curve)" stroke-width="4" filter="url(#glow)"/>
