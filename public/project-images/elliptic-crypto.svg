<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Elliptic curve equation and point addition diagram">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091a34"/><stop offset="1" stop-color="#111a35"/></linearGradient>
 <linearGradient id="curve" x2="1" y2="0"><stop stop-color="#68d8ee"/><stop offset=".55" stop-color="#8c9eff"/><stop offset="1" stop-color="#bd91ff"/></linearGradient>
 <linearGradient id="line" x2="1"><stop stop-color="#f2c879"/><stop offset="1" stop-color="#fa9aab"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#91a9ce" stroke-opacity=".10"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="440" fill="url(#bg)"/><rect width="1200" height="440" fill="url(#grid)"/>
<text x="54" y="55" fill="#83a7da" font-size="14" letter-spacing="3" font-family="Arial,sans-serif">ALGEBRAIC GEOMETRY · CRYPTOGRAPHY</text>
<text x="54" y="92" fill="#eef3ff" font-size="27" font-weight="700" font-family="Arial,sans-serif">Elliptic curve over a finite field</text>
<text x="55" y="126" fill="#a9b9d4" font-size="23" font-family="Georgia,serif" font-style="italic">y² = x³ − 3x + 1</text>
<text x="54" y="153" fill="#748cac" font-size="12" font-family="Arial,sans-serif">Illustration of the curve and the geometric group law</text>
<g transform="translate(0 0)">
