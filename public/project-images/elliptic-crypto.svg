 <path d="M151 199V241" stroke="#d4a4ff" stroke-width="1.8" stroke-dasharray="4 5"/>
 <circle cx="151" cy="199" r="6.5" fill="#f4cd81" stroke="#fff0c8" stroke-width="2"/>
 <circle cx="376" cy="155" r="7" fill="#78d9e8" stroke="#e2fbff" stroke-width="2"/>
 <circle cx="606" cy="107" r="7" fill="#aab0ff" stroke="#eef0ff" stroke-width="2"/>
 <circle cx="151" cy="241" r="7" fill="#bd91ff" stroke="#f4e7ff" stroke-width="2"/>
 <text x="127" y="184" fill="#f3d18e" font-size="16" font-weight="700" font-family="Arial,sans-serif">R</text>
 <text x="358" y="143" fill="#9ceaf2" font-size="16" font-weight="700" font-family="Arial,sans-serif">P</text>
 <text x="618" y="100" fill="#c1c2ff" font-size="16" font-weight="700" font-family="Arial,sans-serif">Q</text>
 <text x="101" y="264" fill="#d8b5ff" font-size="16" font-weight="700" font-family="Arial,sans-serif">P + Q = −R</text>
 <text x="510" y="80" fill="#e9c17c" font-size="12" font-family="Arial,sans-serif">Secant line</text>
</g>
<rect x="862" y="62" width="285" height="316" rx="15" fill="#142540" stroke="#3e5d86"/>
<text x="890" y="101" fill="#82a9df" font-size="12" letter-spacing="2" font-family="Arial,sans-serif">GROUP OPERATION</text>
<text x="890" y="150" fill="#f1f5ff" font-size="25" font-family="Georgia,serif" font-style="italic">P + Q = −R</text>
<path d="M890 177H1118" stroke="#456184"/>
<text x="890" y="214" fill="#9fb2ce" font-size="13" font-family="Arial,sans-serif">Points on the curve form</text>
<text x="890" y="235" fill="#9fb2ce" font-size="13" font-family="Arial,sans-serif">an abelian group under</text>
<text x="890" y="256" fill="#9fb2ce" font-size="13" font-family="Arial,sans-serif">the elliptic-curve law.</text>
<g transform="translate(890 285)">
 <circle cx="11" cy="11" r="5" fill="#78d9e8"/><text x="27" y="16" fill="#cbd8ee" font-size="12" font-family="Arial,sans-serif">Point addition</text>
