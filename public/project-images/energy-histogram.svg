<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Illustrative histogram of hourly energy predictions in kilowatt-hours">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1c35"/><stop offset="1" stop-color="#111a36"/></linearGradient>
 <linearGradient id="bar" x2="0" y2="1"><stop stop-color="#66d8e5"/><stop offset="1" stop-color="#477bd8"/></linearGradient>
 <linearGradient id="accent" x2="1"><stop stop-color="#5ed8eb"/><stop offset="1" stop-color="#9d8aff"/></linearGradient>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#9bb3d9" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1200" height="440" fill="url(#bg)"/><rect width="1200" height="440" fill="url(#grid)"/>
